<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="100%" height="100%">
  <defs>
    <linearGradient id="nesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="nesShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="900" height="420" rx="12" fill="url(#nesBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="0" y="0" width="900" height="42" rx="12" fill="#111827"/>
  <circle cx="24" cy="21" r="5" fill="#ef4444"/>
  <circle cx="40" cy="21" r="5" fill="#f59e0b"/>
  <circle cx="56" cy="21" r="5" fill="#10b981"/>
  <text x="80" y="26" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Copilot NES (Next Edit Suggestions) — Inline &amp; Side-by-Side Review</text>
  <rect x="730" y="10" width="150" height="22" rx="11" fill="#1e293b"/>
  <text x="742" y="25" font-family="monospace" font-size="11" fill="#38bdf8">:Sidekick nes review</text>

  <!-- Left Pane: Original Buffer -->
  <g transform="translate(20, 56)">
    <rect width="420" height="310" rx="8" fill="#030712" stroke="#334155" stroke-width="1"/>
    <!-- Pane Header -->
    <rect width="420" height="28" rx="8" fill="#1e293b"/>
    <text x="14" y="19" font-family="monospace" font-size="12" font-weight="700" fill="#ef4444">Current Buffer (hunk 1 of 2)</text>
    <text x="360" y="19" font-family="monospace" font-size="11" fill="#94a3b8">main.lua</text>

    <!-- Code lines -->
    <text x="14" y="55" font-family="monospace" font-size="12" fill="#64748b">18  local function calculate_total(items)</text>
    <text x="14" y="75" font-family="monospace" font-size="12" fill="#64748b">19    local sum = 0</text>
    <text x="14" y="95" font-family="monospace" font-size="12" fill="#64748b">20    for _, item in ipairs(items) do</text>
    
    <!-- Old deleted lines -->
    <rect x="4" y="103" width="412" height="42" fill="#450a0a" opacity="0.75" rx="3"/>
    <text x="14" y="118" font-family="monospace" font-size="12" fill="#fca5a5">21 -    sum = sum + item.price</text>
    <text x="14" y="138" font-family="monospace" font-size="12" fill="#fca5a5">22 -    -- no discount applied</text>

    <text x="14" y="165" font-family="monospace" font-size="12" fill="#64748b">23    end</text>
    <text x="14" y="185" font-family="monospace" font-size="12" fill="#64748b">24    return sum</text>
    <text x="14" y="205" font-family="monospace" font-size="12" fill="#64748b">25  end</text>

    <!-- Extmark / statusline teaser -->
    <g transform="translate(10, 240)">
      <rect width="400" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="22" font-family="monospace" font-size="11" fill="#38bdf8">💡 Inline Diff: Characters &amp; Words granularity</text>
      <text x="14" y="38" font-family="monospace" font-size="10" fill="#94a3b8">Debounced auto-trigger on typing pause (300ms)</text>
    </g>
  </g>

  <!-- Right Pane: Suggested Buffer -->
  <g transform="translate(460, 56)">
    <rect width="420" height="310" rx="8" fill="#030712" stroke="#10b981" stroke-width="1.2"/>
    <!-- Pane Header -->
    <rect width="420" height="28" rx="8" fill="#064e3b"/>
    <text x="14" y="19" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">Copilot Suggested Next Edit</text>
    <text x="345" y="19" font-family="monospace" font-size="11" fill="#a7f3d0">[Tab] Focus</text>

    <!-- Code lines -->
    <text x="14" y="55" font-family="monospace" font-size="12" fill="#64748b">18  local function calculate_total(items)</text>
    <text x="14" y="75" font-family="monospace" font-size="12" fill="#64748b">19    local sum = 0</text>
    <text x="14" y="95" font-family="monospace" font-size="12" fill="#64748b">20    for _, item in ipairs(items) do</text>

    <!-- New inserted lines with word diff highlights -->
    <rect x="4" y="103" width="412" height="42" fill="#064e3b" opacity="0.8" rx="3"/>
    <text x="14" y="118" font-family="monospace" font-size="12" fill="#86efac">21 +    local discount = item.discount or 0</text>
    <text x="14" y="138" font-family="monospace" font-size="12" fill="#86efac">22 +    sum = sum + (item.price * (1 - discount))</text>

    <text x="14" y="165" font-family="monospace" font-size="12" fill="#64748b">23    end</text>
    <text x="14" y="185" font-family="monospace" font-size="12" fill="#64748b">24    return sum</text>
    <text x="14" y="205" font-family="monospace" font-size="12" fill="#64748b">25  end</text>

    <!-- Hunk stats -->
    <g transform="translate(10, 240)">
      <rect width="400" height="50" rx="6" fill="#0f172a" stroke="#1e293b"/>
      <text x="14" y="22" font-family="monospace" font-size="11" fill="#34d399">✓ Treesitter Syntax-Aware AST Validation</text>
      <text x="14" y="38" font-family="monospace" font-size="10" fill="#94a3b8">Auto-applies jumplist entry for quick undo/jump</text>
    </g>
  </g>

  <!-- Bottom Navigation Bar -->
  <rect x="20" y="375" width="860" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
  <text x="35" y="397" font-family="monospace" font-size="12" fill="#e2e8f0">
    <tspan fill="#38bdf8" font-weight="700">&lt;Tab&gt;</tspan> Apply suggestion  │  
    <tspan fill="#fbbf24" font-weight="700">[a]</tspan> Accept hunk  │  
    <tspan fill="#f87171" font-weight="700">[r]</tspan> Reject hunk  │  
    <tspan fill="#a855f7" font-weight="700">[A]</tspan> Accept all  │  
    <tspan fill="#60a5fa" font-weight="700">]c / [c</tspan> Next/Prev hunk  │  
    <tspan fill="#94a3b8" font-weight="700">[q]</tspan> Close
  </text>
</svg>
